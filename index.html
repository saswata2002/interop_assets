<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interop Assets</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f4f4f2; }
  @media (prefers-color-scheme: dark) { html, body { background: #121212; } }
  body { display: flex; align-items: center; justify-content: center; gap: 24px; padding: 24px 16px;
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; color: #161616; }

  /* 375 × 812, shrunk to fit a short window rather than cropped. */
  .phone { position: relative; flex: none;
    width: min(375px, calc((100vh - 48px) * 375 / 812)); aspect-ratio: 375 / 812;
    overflow: hidden; background: #D12B28;
    box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 30px 80px -20px rgba(0,0,0,.35); }
  .phone canvas { display: block; width: 100%; height: 100%; }
  .phone.is-drop::after { content: 'Drop image'; position: absolute; inset: 12px; display: grid; place-items: center;
    border: 2px dashed rgba(255,255,255,.9); color: #fff; font-size: 15px; font-weight: 600; background: rgba(0,0,0,.25); }

  /* Controller: one white card, four label / control rows. */
  .ctl { width: 248px; padding: 4px 14px; border-radius: 16px; background: #fff;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px -14px rgba(0,0,0,.3); }
  .f { display: flex; align-items: center; gap: 10px; min-height: 52px; }
  .f + .f { border-top: 1px solid #efefec; }
  .k { flex: none; width: 74px; color: #8a8a85; font-size: 12px; }

  .field { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 10px;
    border-radius: 8px; background: #f4f4f2; }
  .field:focus-within { box-shadow: inset 0 0 0 1px #161616; }
  .field input[type=text] { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; padding: 0; background: none;
    font: inherit; color: inherit; }
  .field.is-bad input { color: #D12B28; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace !important; font-size: 12.5px !important;
    letter-spacing: .02em; text-transform: uppercase; }
  .chip { position: relative; flex: none; width: 16px; height: 16px; border-radius: 4px; margin-left: -2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.14); }
  .chip input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

  .pick { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .pick input { display: none; }
  .tile { flex: none; width: 32px; height: 32px; border-radius: 8px; overflow: hidden; display: grid; place-items: center;
    background: #f4f4f2 center / cover; color: #8a8a85; font-size: 18px; line-height: 1; }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* The logo tile shows the whole lockup (or its replacement), not a crop. */
  .tile--logo { position: relative; padding: 0 3px; }
  .tile--logo img { position: absolute; inset: 0 3px; width: calc(100% - 6px); object-fit: contain; }
  .pick span:last-child { color: #161616; }
  .pick:hover span:last-child { text-decoration: underline; text-underline-offset: 2px; }

  .x { flex: none; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: none;
    color: #8a8a85; font: 15px/1 inherit; cursor: pointer; display: grid; place-items: center; }
  .x:hover { background: #ebebe7; color: #161616; }
  .x[hidden] { display: none; }

  @media (max-width: 560px) {
    body { flex-direction: column; gap: 14px; }
    .ctl { width: min(375px, 100%); }
  }
  @media (max-width: 420px) {
    body { padding: 0 0 16px; justify-content: flex-start; }
    .phone { width: 100vw; box-shadow: none; }
    .ctl { width: calc(100% - 32px); }
  }
</style>
</head>
<body>
  <div class="phone" id="phone"><canvas id="stage" width="750" height="1624"></canvas></div>

  <div class="ctl">
    <div class="f">
      <span class="k">Text</span>
      <div class="field">
        <input id="title-in" type="text" value="Switching to" maxlength="24" spellcheck="false" autocomplete="off" aria-label="Title text">
        <button class="x" id="title-reset" hidden title="Reset text" aria-label="Reset text">↺</button>
      </div>
    </div>
    <div class="f">
      <span class="k">Logo</span>
      <label class="pick">
        <span class="tile tile--logo" id="logo-thumb">
          <img src="assets/switching-to-minutes/Minutes box.svg" alt="">
          <img src="assets/switching-to-minutes/Minutes ticket.svg" alt="">
        </span>
        <span>Replace</span>
        <input id="logo-file" type="file" accept="image/*">
      </label>
      <button class="x" id="logo-reset" hidden title="Reset logo" aria-label="Reset logo">↺</button>
    </div>
    <div class="f">
      <span class="k">Colour</span>
      <div class="field" id="hex">
        <span class="chip" id="chip"><input id="picker" type="color" value="#d12b28" aria-label="Pick a colour"></span>
        <input id="hex-in" class="mono" type="text" value="#D12B28" maxlength="7" spellcheck="false" autocomplete="off" aria-label="Background hex code">
      </div>
    </div>
    <div class="f">
      <span class="k">Background</span>
      <label class="pick">
        <span class="tile" id="bg-thumb">+</span>
        <span id="bg-label">Add image</span>
        <input id="bg-file" type="file" accept="image/*">
      </label>
      <button class="x" id="bg-remove" hidden title="Remove background image" aria-label="Remove background image">×</button>
    </div>
    <div class="f">
      <span class="k">Crate</span>
      <label class="pick">
        <span class="tile"><img id="thumb" src="assets/switching-to-minutes/crate-image@2x.webp" alt=""></span>
        <span>Replace</span>
        <input id="file" type="file" accept="image/*">
      </label>
      <button class="x" id="reset-img" hidden title="Reset crate image" aria-label="Reset crate image">↺</button>
    </div>
  </div>

<script type="module">
  import { createSwitchingToMinutes, FPS, DURATION } from './src/switching-to-minutes.js';

  const canvas = document.getElementById('stage');
  // Draw at the screen's own density (the comp is @2x of 375 × 812).
  const fit = () => {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    // A hidden or not-yet-laid-out frame measures 0; draw at comp size then.
    canvas.width = r.width ? Math.round(r.width * dpr) : 750;
    canvas.height = r.height ? Math.round(r.height * dpr) : 1624;
  };
  fit();
  const anim = await createSwitchingToMinutes(canvas);

  // Plays the sequence on repeat.
  let playing = true, t = 0, last = performance.now();
  function tick(now) {
    const dt = Math.min((now - last) / 1000, 0.1); last = now;
    if (playing) { t = (t + dt) % DURATION; anim.render(t); }
    requestAnimationFrame(tick);
  }
  addEventListener('resize', () => { fit(); anim.render(t); });
  const $ = id => document.getElementById(id);
  const redraw = () => { if (!playing) anim.render(t); };

  // ── Text: the title line ──
  const TITLE = 'Switching to';
  function setTitle(text) {
    anim.setTitle(text);
    $('title-reset').hidden = text === TITLE;
    redraw();
  }
  $('title-in').addEventListener('input', e => setTitle(e.target.value));
  $('title-reset').addEventListener('click', () => { $('title-in').value = TITLE; setTitle(TITLE); });

  // ── Colour: a hex box (#RGB or #RRGGBB, the # optional) ──
  const parseHex = v => {
    const m = v.trim().replace(/^#/, '').match(/^([0-9a-f]{3}|[0-9a-f]{6})$/i);
    if (!m) return null;
    const h = m[1].length === 3 ? [...m[1]].map(c => c + c).join('') : m[1];
    return '#' + h.toUpperCase();
  };
  let bg = '#D12B28';
  function setBg(hex) {
    bg = hex;
    anim.setBackground(hex);
    $('phone').style.background = hex;
    $('chip').style.background = hex;
    $('picker').value = hex.toLowerCase();
    redraw();
  }
  $('hex-in').addEventListener('input', e => {
    const hex = parseHex(e.target.value);
    $('hex').classList.toggle('is-bad', !hex && e.target.value.trim() !== '');
    if (hex) setBg(hex);
  });
  const settle = () => { $('hex-in').value = bg; $('hex').classList.remove('is-bad'); };
  $('hex-in').addEventListener('blur', settle);
  $('hex-in').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
  $('picker').addEventListener('input', e => { setBg(e.target.value.toUpperCase()); settle(); });
  setBg(bg);

  // Decodes a picked/dropped file into an <img> (or null if it isn't one).
  async function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return null;
    const im = new Image();
    im.src = URL.createObjectURL(file);
    try { await im.decode(); return im; } catch { URL.revokeObjectURL(im.src); return null; }
  }

  // ── Background image: a picture over the colour, filling the screen ──
  let bgImg = null;
  function setBgImage(im) {
    if (bgImg) URL.revokeObjectURL(bgImg.src);
    bgImg = im;
    anim.setBackgroundImage(im);
    $('bg-thumb').style.backgroundImage = im ? `url(${im.src})` : '';
    $('bg-thumb').textContent = im ? '' : '+';
    $('bg-label').textContent = im ? 'Change image' : 'Add image';
    $('bg-remove').hidden = !im;
    redraw();
  }
  $('bg-file').addEventListener('change', async e => {
    const im = await loadFile(e.target.files[0]); e.target.value = '';
    if (im) setBgImage(im);
  });
  $('bg-remove').addEventListener('click', () => setBgImage(null));

  // ── Logo: replace the MINUTES lockup (PNG, SVG, …) ──
  const LOGO_THUMB = $('logo-thumb').innerHTML;
  let logoImg = null;
  function setLogo(im) {
    if (logoImg) URL.revokeObjectURL(logoImg.src);
    logoImg = im;
    anim.setLogo(im);
    $('logo-thumb').innerHTML = im ? `<img src="${im.src}" alt="">` : LOGO_THUMB;
    $('logo-reset').hidden = !im;
    redraw();
  }
  $('logo-file').addEventListener('change', async e => {
    const im = await loadFile(e.target.files[0]); e.target.value = '';
    if (im) setLogo(im);
  });
  $('logo-reset').addEventListener('click', () => setLogo(null));

  // ── Crate: replace the picture from a file (row or a drop on the frame) ──
  let url = null;
  function setCrate(im) {
    if (url) URL.revokeObjectURL(url);
    url = im ? im.src : null;
    anim.setImage(im);
    $('thumb').src = url || 'assets/switching-to-minutes/crate-image@2x.webp';
    $('reset-img').hidden = !im;
    redraw();
  }
  $('file').addEventListener('change', async e => {
    const im = await loadFile(e.target.files[0]); e.target.value = '';
    if (im) setCrate(im);
  });
  $('reset-img').addEventListener('click', () => setCrate(null));
  const phone = $('phone');
  phone.addEventListener('dragover', e => { e.preventDefault(); phone.classList.add('is-drop'); });
  phone.addEventListener('dragleave', () => phone.classList.remove('is-drop'));
  phone.addEventListener('drop', async e => {
    e.preventDefault(); phone.classList.remove('is-drop');
    const im = await loadFile(e.dataTransfer.files[0]);
    if (im) setCrate(im);
  });

  // Headless checks render exact frames at comp size.
  window.__renderFrame = f => {
    playing = false; canvas.width = 750; canvas.height = 1624;
    t = f / FPS; anim.render(t);
    return canvas.toDataURL('image/png');
  };

  anim.render(t);
  requestAnimationFrame(tick);
</script>
</body>
</html>
